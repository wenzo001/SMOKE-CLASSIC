<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0912">
<meta name="description" content="吞云 SMOKE CLASSIC — 8-bit 像素风抽烟主题街机小游戏">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="吞云">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>吞云 · SMOKE CLASSIC</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%;background:#07060d;overflow:hidden;
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    touch-action:manipulation;overscroll-behavior:none;
  }
  /* 舞台：固定铺满视口，dvh 兼容移动端地址栏收缩，安全区由 padding 让出 */
  #stage{
    position:fixed;left:0;top:0;right:0;bottom:0;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 6px)
            calc(env(safe-area-inset-bottom) + 6px) calc(env(safe-area-inset-left) + 6px);
    background:
      radial-gradient(120% 90% at 50% 0%,#17122a 0%,#0a0812 60%,#050409 100%);
    touch-action:none;
  }
  /* 机台：竖屏用 flex 居中；横屏整块旋转 90° 并绝对居中 */
  #bezel{
    padding:10px;border-radius:12px;
    background:linear-gradient(160deg,#241d3d,#100d1c);
    box-shadow:
      0 0 0 2px #0c0a16,
      0 0 0 4px #2b2348,
      0 0 46px rgba(120,80,210,.28),
      inset 0 1px 0 rgba(255,255,255,.06);
  }
  #bezel.rot{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%) rotate(var(--rot,90deg));
  }
  #bezel::after{
    content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,0) 38%);
  }
  #game{
    display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    background:#15111f;touch-action:none;cursor:pointer;
    border-radius:2px;
  }
  /* 操作提示：竖屏跟在机台下方；横屏隐藏 */
  #hint{
    color:#6f6695;font-size:12px;letter-spacing:.06em;text-align:center;
    line-height:1.7;max-width:min(92vw,560px);
    pointer-events:none;flex:0 0 auto;
  }
  #hint b{color:#a294cf;font-weight:600}
  body.rot #hint{ display:none; }
  @media (max-width:360px){ #hint{font-size:11px;letter-spacing:0} }
  @media (max-height:520px){ #hint{display:none} }
</style>
</head>
<body>
<div id="stage">
  <div id="bezel"><canvas id="game" width="320" height="480"></canvas></div>
  <div id="hint">
    <b>空格/回车</b> 操作 · <b>P</b> 暂停 · <b>R</b> 重开 · <b>←→</b> 瞄准 · 手机直接点按/长按/拖动
  </div>
</div>
  <script src="src/core/const.js"></script>
  <script src="src/core/utils.js"></script>
  <script src="src/core/layout.js"></script>
  <script src="src/core/font.js"></script>
  <script src="src/core/sprites.js"></script>
  <script src="src/core/audio.js"></script>
  <script src="src/data/content.js"></script>
  <script src="src/core/storage.js"></script>
  <script src="src/game/state.js"></script>
  <script src="src/game/feel.js"></script>
  <script src="src/game/input.js"></script>
  <script src="src/game/rules.js"></script>
  <script src="src/game/update.js"></script>
  <script src="src/render/draw.js"></script>
  <script src="src/render/scene.js"></script>
  <script src="src/render/screens.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
